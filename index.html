<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>❤️学霸教育分数速算小游戏❤️</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #FFF5E6;
            text-align: center;
            padding: 10px;
            color: #FF6B88;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .game-container {
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 8px 15px rgba(255, 107, 136, 0.2);
            position: relative;
        }

        h1 {
            color: #FF6B88;
            font-size: clamp(1.5em, 5vw, 2em);
            margin-bottom: 10px;
            word-break: break-word;
        }

        .subtitle {
            color: #FF9E7D;
            margin-bottom: 15px;
            font-size: clamp(0.8em, 3vw, 0.9em);
        }

        .player-name {
            margin-bottom: 15px;
        }

        .player-name input {
            font-size: 1em;
            padding: 8px 12px;
            border: 2px solid #FFD166;
            border-radius: 15px;
            text-align: center;
            color: #4D96FF;
            width: 60%;
            max-width: 200px;
        }

        .problem-container {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .fraction {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 5px;
            position: relative;
        }

        .numerator, .denominator {
            font-size: clamp(1.8em, 7vw, 2.2em);
            color: #6BCB77;
            width: 1.5em;
            text-align: center;
        }

        .denominator {
            border-top: 2px solid #6BCB77;
        }

        .operation {
            font-size: clamp(1.8em, 7vw, 2.2em);
            margin: 0 5px;
            color: #6BCB77;
        }

        .equals {
            font-size: clamp(1.8em, 7vw, 2.2em);
            margin: 0 5px;
            color: #6BCB77;
        }

        .answer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 5px;
        }

        .answer-input {
            font-size: clamp(1.8em, 7vw, 2.2em);
            padding: 5px 10px;
            border: 3px solid #FFD166;
            border-radius: 10px;
            width: 1.5em;
            text-align: center;
            color: #6BCB77;
            transition: all 0.3s;
            -webkit-appearance: none;
        }

        .answer-input.correct {
            border-color: #6BCB77;
            background-color: #E8F5E9;
        }

        .answer-input.incorrect {
            border-color: #FF6B88;
            background-color: #FFEBEE;
        }

        .workspace-container {
            margin-top: 20px;
            width: 100%;
        }

        .workspace-label {
            font-size: clamp(0.9em, 3vw, 1em);
            color: #FF9E7D;
            margin-bottom: 5px;
            text-align: left;
            padding-left: 10px;
        }

        .workspace {
            width: 100%;
            height: 200px; /* 增加工作区高度 */
            border: 2px dashed #FFD166;
            border-radius: 10px;
            background-color: #FFF9F0;
            padding: 15px;
            box-sizing: border-box;
            text-align: left;
            font-size: clamp(1em, 3vw, 1.1em);
            color: #666;
            touch-action: manipulation;
            -webkit-user-select: text;
            user-select: text;
            overflow-y: auto;
            line-height: 1.5;
            outline: none;
        }

        .workspace:focus {
            border-color: #4D96FF;
        }

        .score {
            font-size: clamp(1em, 4vw, 1.1em);
            margin-top: 15px;
            color: #4D96FF;
        }

        .timer {
            font-size: clamp(1.1em, 4vw, 1.3em);
            color: #FF9E7D;
            margin: 10px 0;
        }

        .progress {
            font-size: clamp(1em, 4vw, 1.1em);
            color: #4D96FF;
            margin: 10px 0;
        }

        .emoji {
            font-size: clamp(1.2em, 4vw, 1.5em);
            margin: 0 3px;
        }

        .stars {
            font-size: clamp(1.5em, 5vw, 1.8em);
            margin: 15px 0;
        }

        .history {
            margin-top: 20px;
            border-top: 2px dashed #FFD166;
            padding-top: 15px;
        }

        .history h3 {
            color: #FF9E7D;
            font-size: clamp(1em, 4vw, 1.2em);
        }

        .history-controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .history-btn {
            background-color: #FFD166;
            border: none;
            border-radius: 15px;
            padding: 5px 12px;
            font-size: clamp(0.7em, 3vw, 0.8em);
            cursor: pointer;
            transition: all 0.3s;
            min-width: 60px;
        }

        .history-btn.active {
            background-color: #FF9E7D;
            color: white;
        }

        .history-btn:hover {
            transform: scale(1.05);
        }

        .history-list {
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
            padding: 8px;
            background-color: #FFF9F0;
            border-radius: 10px;
            font-size: clamp(0.8em, 3vw, 0.9em);
        }

        .history-item {
            margin: 5px 0;
            padding: 5px;
            border-bottom: 1px solid #FFE8D6;
            word-break: break-word;
        }

        .history-correct {
            color: #6BCB77;
        }

        .history-incorrect {
            color: #FF6B88;
        }

        .feedback {
            font-size: clamp(1em, 4vw, 1.1em);
            margin: 10px 0;
            min-height: 20px;
            word-break: break-word;
        }

        .feedback.correct {
            color: #6BCB77;
        }

        .feedback.incorrect {
            color: #FF6B88;
        }

        .summary {
            background-color: #FFF9F0;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            display: none;
        }

        .summary h3 {
            color: #FF9E7D;
            margin-top: 0;
            font-size: clamp(1em, 4vw, 1.2em);
        }

        .player-summary {
            font-size: clamp(1em, 4vw, 1.2em);
            color: #4D96FF;
            margin-bottom: 10px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: clamp(0.9em, 3vw, 1em);
        }

        .operation-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .operation-btn {
            background-color: #4D96FF;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 8px 15px;
            font-size: clamp(0.8em, 3vw, 0.9em);
            cursor: pointer;
            transition: all 0.3s;
        }

        .operation-btn.active {
            background-color: #FF6B88;
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(255, 107, 136, 0.3);
        }

        .operation-btn:hover {
            transform: scale(1.05);
        }

        .music-control {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: clamp(1.2em, 4vw, 1.5em);
            cursor: pointer;
            color: #FF9E7D;
        }

        @media (max-width: 320px) {
            .player-name input {
                width: 80%;
            }
            
            .operation-btn {
                padding: 6px 10px;
            }
        }

        @supports (-webkit-touch-callout: none) {
            body {
                -webkit-text-size-adjust: 100%;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <button class="music-control" id="music-toggle">🔊</button>
    <h1>❤️学霸教育分数速算小游戏❤️ <span class="emoji">✨</span></h1>
    <p class="subtitle">选择题目类型，输入答案后自动检查对错</p>
    
    <div class="player-name">
        <input type="text" id="player-name" placeholder="输入你的名字" maxlength="10">
    </div>

    <div class="operation-selector">
        <button class="operation-btn active" data-operation="add">分数加法➕</button>
        <button class="operation-btn" data-operation="subtract">分数减法➖</button>
        <button class="operation-btn" data-operation="multiply">分数乘法✖️</button>
        <button class="operation-btn" data-operation="divide">分数除法➗</button>
    </div>

    <div class="timer" id="timer">用时: 0秒</div>
    <div class="progress" id="progress">第1题/共10题</div>

    <div class="stars" id="stars">
        <span class="emoji">⭐</span>
        <span class="emoji">⭐</span>
        <span class="emoji">⭐</span>
    </div>

    <div class="problem-container">
        <div style="display: flex; align-items: center;">
            <div class="fraction">
                <div class="numerator" id="num1">5</div>
                <div class="denominator" id="den1">6</div>
            </div>
            <div class="operation" id="operation">×</div>
            <div class="fraction">
                <div class="numerator" id="num2">3</div>
                <div class="denominator" id="den2">4</div>
            </div>
            <div class="equals">=</div>
            <div class="answer-container">
                <input type="number" class="answer-input" id="answer-numerator" placeholder="?" autofocus>
                <div style="border-top: 2px solid #6BCB77; width: 100%;"></div>
                <input type="number" class="answer-input" id="answer-denominator" placeholder="?">
            </div>
        </div>
    </div>

    <div class="workspace-container">
        <div class="workspace-label">这是做算式的位置 (点击此处开始手写或输入)</div>
        <div class="workspace" id="workspace" contenteditable="true"></div>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="score" id="score">得分: 0 | 星星: 3</div>

    <div class="summary" id="summary">
        <h3>答题总结 <span class="emoji">📊</span></h3>
        <div class="player-summary" id="player-summary">小玩家的成绩</div>
        <div class="summary-item">
            <span>总答题数:</span>
            <span id="total-answers">10</span>
        </div>
        <div class="summary-item">
            <span>正确:</span>
            <span id="correct-answers">0</span>
        </div>
        <div class="summary-item">
            <span>错误:</span>
            <span id="wrong-answers">0</span>
        </div>
        <div class="summary-item">
            <span>正确率:</span>
            <span id="accuracy">0%</span>
        </div>
        <div class="summary-item">
            <span>用时:</span>
            <span id="total-time">0秒</span>
        </div>
    </div>

    <div class="history">
        <h3>答题历史 <span class="emoji">📝</span></h3>
        <div class="history-controls">
            <button class="history-btn active" id="show-all">全部</button>
            <button class="history-btn" id="show-correct">正确</button>
            <button class="history-btn" id="show-incorrect">错误</button>
        </div>
        <div class="history-list" id="history-list">
            <p>还没有答题记录哦~</p>
        </div>
    </div>
</div>

<script>
    let score = 0;
    let stars = 3;
    let num1, num2, den1, den2, correctAnswer;
    let history = [];
    let isChecking = false;
    let historyFilter = 'all';
    let operation = 'multiply';
    let timeElapsed = 0;
    let timer;
    let correctCount = 0;
    let wrongCount = 0;
    let gameStarted = false;
    let playerName = '小玩家';
    let currentQuestion = 1;
    const totalQuestions = 10;

    // 计算最大公约数
    function gcd(a, b) {
        return b ? gcd(b, a % b) : a;
    }

    // 约分分数
    function simplifyFraction(numerator, denominator) {
        const commonDivisor = gcd(numerator, denominator);
        return [numerator / commonDivisor, denominator / commonDivisor];
    }

    function initGame() {
        score = 0;
        stars = 3;
        history = [];
        correctCount = 0;
        wrongCount = 0;
        timeElapsed = 0;
        currentQuestion = 1;
        gameStarted = false;
        
        const nameInput = document.getElementById('player-name');
        playerName = nameInput.value.trim() || '小玩家';
        document.getElementById('player-summary').textContent = `${playerName}的成绩`;
        
        updateStars();
        updateHistoryDisplay();
        updateSummary();
        document.getElementById('timer').textContent = `用时: ${timeElapsed}秒`;
        document.getElementById('progress').textContent = `第${currentQuestion}题/共${totalQuestions}题`;
        document.getElementById('summary').style.display = 'none';
        document.getElementById('workspace').innerHTML = '';
        
        if (timer) clearInterval(timer);
    }

    function startGame() {
        if (gameStarted) return;
        
        gameStarted = true;
        generateProblem();
        
        timer = setInterval(() => {
            timeElapsed++;
            document.getElementById('timer').textContent = `用时: ${timeElapsed}秒`;
        }, 1000);
    }

    function endGame() {
        clearInterval(timer);
        document.getElementById('answer-numerator').disabled = true;
        document.getElementById('answer-denominator').disabled = true;
        document.getElementById('summary').style.display = 'block';
        document.getElementById('player-summary').textContent = `${playerName}的成绩`;
        document.getElementById('total-time').textContent = `${timeElapsed}秒`;
        updateSummary();
        
        setTimeout(() => {
            alert(`${playerName}，10题完成！\n你的最终得分是: ${score}\n正确: ${correctCount}题\n错误: ${wrongCount}题\n用时: ${timeElapsed}秒`);
        }, 500);
    }

    function resetGame() {
        initGame();
        generateProblem();
        document.getElementById('answer-numerator').disabled = false;
        document.getElementById('answer-denominator').disabled = false;
        document.getElementById('answer-numerator').focus();
    }

    function generateProblem() {
        if (!gameStarted) return;
        
        isChecking = false;
        
        switch (operation) {
            case 'add':
                // 生成同分母的分数加法
                den1 = Math.floor(Math.random() * 6) + 2; // 分母2-7
                num1 = Math.floor(Math.random() * (den1 - 1)) + 1; // 分子1到分母-1
                den2 = den1; // 同分母
                num2 = Math.floor(Math.random() * (den2 - 1)) + 1;
                
                correctAnswer = simplifyFraction(num1 + num2, den1);
                break;
                
            case 'subtract':
                // 生成同分母的分数减法，确保结果为正
                den1 = Math.floor(Math.random() * 6) + 2; // 分母2-7
                num1 = Math.floor(Math.random() * (den1 - 1)) + 1; // 分子1到分母-1
                den2 = den1; // 同分母
                num2 = Math.floor(Math.random() * (den2 - 1)) + 1;
                
                // 确保减法结果为正
                if (num1 < num2) [num1, num2] = [num2, num1];
                correctAnswer = simplifyFraction(num1 - num2, den1);
                break;
                
            case 'multiply':
                // 生成分数乘法
                den1 = Math.floor(Math.random() * 6) + 2; // 分母2-7
                num1 = Math.floor(Math.random() * (den1 - 1)) + 1; // 分子1到分母-1
                den2 = Math.floor(Math.random() * 6) + 2;
                num2 = Math.floor(Math.random() * (den2 - 1)) + 1;
                
                correctAnswer = simplifyFraction(num1 * num2, den1 * den2);
                break;
                
            case 'divide':
                // 生成分数除法
                den1 = Math.floor(Math.random() * 6) + 2; // 分母2-7
                num1 = Math.floor(Math.random() * (den1 - 1)) + 1; // 分子1到分母-1
                num2 = Math.floor(Math.random() * 6) + 2; // 除数分子2-7
                den2 = Math.floor(Math.random() * (num2 - 1)) + 1; // 除数分母1到分子-1
                
                correctAnswer = simplifyFraction(num1 * den2, den1 * num2);
                break;
        }

        // 更新题目显示
        document.getElementById('num1').textContent = num1;
        document.getElementById('den1').textContent = den1;
        document.getElementById('operation').textContent = getOperationSymbol();
        document.getElementById('num2').textContent = num2;
        document.getElementById('den2').textContent = den2;

        // 清空答案输入框
        document.getElementById('answer-numerator').value = '';
        document.getElementById('answer-denominator').value = '';
        document.getElementById('answer-numerator').className = 'answer-input';
        document.getElementById('answer-denominator').className = 'answer-input';
        document.getElementById('answer-numerator').focus();

        document.getElementById('feedback').textContent = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('progress').textContent = `第${currentQuestion}题/共${totalQuestions}题`;
        document.getElementById('workspace').innerHTML = '';
    }

    function updateStars() {
        const starsContainer = document.getElementById('stars');
        starsContainer.innerHTML = '';

        for (let i = 0; i < stars; i++) {
            starsContainer.innerHTML += '<span class="emoji">⭐</span>';
        }

        for (let i = stars; i < 3; i++) {
            starsContainer.innerHTML += '<span class="emoji" style="opacity:0.3;">⭐</span>';
        }

        document.getElementById('score').textContent = `得分: ${score} | 星星: ${stars}`;
    }

    function updateSummary() {
        const accuracy = totalQuestions > 0 ? Math.round((correctCount / totalQuestions) * 100) : 0;
        
        document.getElementById('total-answers').textContent = totalQuestions;
        document.getElementById('correct-answers').textContent = correctCount;
        document.getElementById('wrong-answers').textContent = wrongCount;
        document.getElementById('accuracy').textContent = `${accuracy}%`;
    }

    function addHistory(isCorrect, userAnswer) {
        const historyItem = {
            problem: `${num1}/${den1} ${getOperationSymbol()} ${num2}/${den2}`,
            answer: `${correctAnswer[0]}/${correctAnswer[1]}`,
            userAnswer: userAnswer,
            isCorrect: isCorrect,
            time: new Date().toLocaleTimeString()
        };

        history.unshift(historyItem);
        if (history.length > 10) history.pop();
        updateHistoryDisplay();
    }

    function updateHistoryDisplay() {
        const historyList = document.getElementById('history-list');
        historyList.innerHTML = '';

        if (history.length === 0) {
            historyList.innerHTML = '<p>还没有答题记录哦~</p>';
        } else {
            const filteredHistory = history.filter(item => {
                if (historyFilter === 'all') return true;
                if (historyFilter === 'correct') return item.isCorrect;
                if (historyFilter === 'incorrect') return !item.isCorrect;
                return true;
            });

            if (filteredHistory.length === 0) {
                historyList.innerHTML = `<p>没有${historyFilter === 'correct' ? '正确' : '错误'}的答题记录~</p>`;
            } else {
                filteredHistory.forEach(item => {
                    const historyItem = document.createElement('div');
                    historyItem.className = `history-item ${item.isCorrect ? 'history-correct' : 'history-incorrect'}`;
                    const icon = item.isCorrect ? '✅' : '❌';
                    historyItem.innerHTML = `
                        <strong>${icon} ${item.problem} = ${item.answer}</strong>
                        <br>
                        你的答案: ${item.userAnswer} (${item.time})
                    `;
                    historyList.appendChild(historyItem);
                });
            }
        }
    }

    function setHistoryFilter(filter) {
        historyFilter = filter;
        updateHistoryDisplay();

        document.getElementById('show-all').classList.remove('active');
        document.getElementById('show-correct').classList.remove('active');
        document.getElementById('show-incorrect').classList.remove('active');
        document.getElementById(`show-${filter}`).classList.add('active');
    }

    function setOperation(op) {
        operation = op;
        initGame();
        
        document.querySelectorAll('.operation-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        document.querySelector(`.operation-btn[data-operation="${op}"]`).classList.add('active');
        
        startGame();
    }

    function checkAnswer() {
        if (isChecking || !gameStarted) return;

        const numeratorInput = document.getElementById('answer-numerator');
        const denominatorInput = document.getElementById('answer-denominator');
        
        const numerator = parseInt(numeratorInput.value);
        const denominator = parseInt(denominatorInput.value);
        
        if (isNaN(numerator) || isNaN(denominator) || denominator === 0) {
            document.getElementById('feedback').textContent = '请输入有效的分子和分母';
            document.getElementById('feedback').className = 'feedback incorrect';
            return;
        }

        isChecking = true;
        const feedback = document.getElementById('feedback');

        // 简化用户输入的分数
        const simplifiedUserFraction = simplifyFraction(numerator, denominator);
        
        // 比较简化后的分数
        const isCorrect = 
            simplifiedUserFraction[0] === correctAnswer[0] && 
            simplifiedUserFraction[1] === correctAnswer[1];

        if (isCorrect) {
            numeratorInput.className = 'answer-input correct';
            denominatorInput.className = 'answer-input correct';
            feedback.textContent = `正确！${num1}/${den1} ${getOperationSymbol()} ${num2}/${den2} = ${correctAnswer[0]}/${correctAnswer[1]} 🎉`;
            feedback.className = 'feedback correct';
            score++;
            correctCount++;

            const starsElements = document.querySelectorAll('#stars .emoji');
            starsElements.forEach(star => {
                star.style.transform = 'scale(1.5)';
                star.style.transition = 'all 0.3s';
                setTimeout(() => {
                    star.style.transform = 'scale(1)';
                }, 300);
            });

            addHistory(true, `${numerator}/${denominator}`);
        } else {
            numeratorInput.className = 'answer-input incorrect';
            denominatorInput.className = 'answer-input incorrect';
            feedback.textContent = `不对哦！${num1}/${den1} ${getOperationSymbol()} ${num2}/${den2} 不等于 ${numerator}/${denominator}`;
            feedback.className = 'feedback incorrect';
            wrongCount++;

            stars--;
            if (stars < 0) stars = 0;

            addHistory(false, `${numerator}/${denominator}`);
        }

        updateStars();
        updateSummary();

        // 移动到下一题或结束游戏
        currentQuestion++;
        if (currentQuestion > totalQuestions) {
            setTimeout(() => {
                endGame();
            }, 1000);
        } else {
            setTimeout(() => {
                generateProblem();
                isChecking = false;
            }, 1000);
        }
    }

    function getOperationSymbol() {
        switch (operation) {
            case 'add': return '+';
            case 'subtract': return '-';
            case 'multiply': return '×';
            case 'divide': return '÷';
            default: return '×';
        }
    }

    // 事件监听
    document.getElementById('answer-numerator').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('answer-denominator').focus();
        }
    });

    document.getElementById('answer-denominator').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkAnswer();
    });

    document.getElementById('show-all').addEventListener('click', () => setHistoryFilter('all'));
    document.getElementById('show-correct').addEventListener('click', () => setHistoryFilter('correct'));
    document.getElementById('show-incorrect').addEventListener('click', () => setHistoryFilter('incorrect'));

    document.querySelectorAll('.operation-btn').forEach(btn => {
        btn.addEventListener('click', () => setOperation(btn.dataset.operation));
    });

    document.getElementById('player-name').addEventListener('input', function() {
        playerName = this.value.trim() || '小玩家';
        document.getElementById('player-summary').textContent = `${playerName}的成绩`;
    });

    // 工作区点击事件 - 确保可以获取焦点
    document.getElementById('workspace').addEventListener('click', function() {
        this.focus();
    });

    // 初始设置
    setOperation('multiply');

    // 解决iOS键盘问题
    window.addEventListener('resize', function() {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
            window.scrollTo(0, 0);
        }
    });

    // 禁用双击缩放
    document.addEventListener('dblclick', function(e) {
        e.preventDefault();
    }, { passive: false });
</script>
</body>
</html>
